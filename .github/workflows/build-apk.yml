name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
      - clean-main
      - clean-restructure
  pull_request:
    branches:
      - main
      - master
      - clean-main
      - clean-restructure
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Clean project
        run: flutter clean

      - name: Get Flutter packages
        run: flutter pub get --enforce-lockfile

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze project
        run: flutter analyze || true

      - name: Build debug APK for pull request validation
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug --build-number="${GITHUB_RUN_NUMBER}"

      - name: Configure stable Android release signing
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ||
                -z "$ANDROID_KEYSTORE_PASSWORD" ||
                -z "$ANDROID_KEY_ALIAS" ||
                -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Missing Android signing secrets. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD."
            exit 1
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/flutterflashcard-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          if [[ ! -s "$KEYSTORE_FILE" ]]; then
            echo "::error::Decoded Android keystore is empty."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build signed installable release APK
        if: github.event_name != 'pull_request'
        run: flutter build apk --release --build-number="${GITHUB_RUN_NUMBER}"

      - name: Verify release APK signature
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::Android apksigner was not found."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare directly installable APK
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          APK_DIR="build/app/outputs/flutter-apk"
          cp "$APK_DIR/app-release.apk" "$APK_DIR/flutterflashcard.apk"
          (
            cd "$APK_DIR"
            sha256sum flutterflashcard.apk > flutterflashcard.apk.sha256
          )

      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: flutterflashcard-release-apk-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/flutterflashcard.apk
            build/app/outputs/flutter-apk/flutterflashcard.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish direct Android download
        if: >-
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="android-latest"
          APK_DIR="build/app/outputs/flutter-apk"
          APK_FILE="$APK_DIR/flutterflashcard.apk"
          CHECKSUM_FILE="$APK_DIR/flutterflashcard.apk.sha256"
          RELEASE_TITLE="Flutter Flashcards - Android APK"
          RELEASE_NOTES="Install directly on Android by downloading flutterflashcard.apk. Build ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA}."

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_FILE" "$CHECKSUM_FILE" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES"
          else
            gh release create "$RELEASE_TAG" "$APK_FILE" "$CHECKSUM_FILE" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              --latest
          fi
